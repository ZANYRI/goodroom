name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-goodroom-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify lint & production build in CI
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Check VPS deploy secrets
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -n "$VPS_HOST" ] && { [ -n "$VPS_SSH_KEY" ] || [ -n "$VPS_PASSWORD" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets are not configured; skipping SSH deploy."
          fi

      - name: Deploy to VPS over SSH
        if: steps.check_secrets.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            APP_DIR="${{ secrets.VPS_APP_DIR || '/var/www/goodroom' }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              rm -rf "$APP_DIR"
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi
            git fetch origin main
            git reset --hard origin/main
            npm ci
            NODE_OPTIONS="--max-old-space-size=1536" npm run build
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:3002 >/dev/null; then
                echo "Healthcheck passed on port 3002"
                exit 0
              fi
              sleep 2
            done
            echo "Healthcheck failed on port 3002"
            pm2 logs goodroom --lines 30 --nostream
            exit 1
