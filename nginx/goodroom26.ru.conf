# Production HTTPS configuration for goodroom26.ru -> Next.js (127.0.0.1:3002)
# Automated installation & Let's Encrypt certificate issuance:
#   sudo bash /var/www/goodroom/scripts/setup-https.sh goodroom26@mail.ru

# 1. HTTP (80) -> Strict 301 redirect to canonical HTTPS + ACME HTTP-01 challenge
server {
    listen 80;
    listen [::]:80;
    server_name goodroom26.ru www.goodroom26.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://goodroom26.ru$request_uri;
    }
}

# 2. HTTPS www.goodroom26.ru (443) -> Canonical HTTPS goodroom26.ru (301)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goodroom26.ru;

    ssl_certificate /etc/letsencrypt/live/goodroom26.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodroom26.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/goodroom26.ru/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://goodroom26.ru$request_uri;
}

# 3. Main Canonical HTTPS Server: https://goodroom26.ru (443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goodroom26.ru;

    ssl_certificate /etc/letsencrypt/live/goodroom26.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodroom26.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/goodroom26.ru/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GoodRoomSSL:10m;
    ssl_session_tickets off;

    # Strict HTTPS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 16m;

    # Immutable cache for Next.js static chunks
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Long cache for self-hosted fonts & images
    location ~* ^/(fonts|images)/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Next.js App Router Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
